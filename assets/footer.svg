<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="164" viewBox="0 0 1000 164" role="img" aria-labelledby="title"><title id="title">Security before trust. Evidence first, clear limits, better decisions.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b172c"/><stop offset="1" stop-color="#16112d"/></linearGradient><linearGradient id="accent"><stop stop-color="#00bdf4"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#9a6bff"/></linearGradient><radialGradient id="aura"><stop stop-color="#2F6BFF" stop-opacity=".28"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:center;animation:turn 14s linear infinite}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}@keyframes turn{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="998" height="162" rx="20" fill="url(#bg)" stroke="#293653"/><circle cx="500" cy="40" r="250" fill="url(#aura)"/><text x="500" y="66" fill="#e4eeff" text-anchor="middle" font-size="30" font-weight="700">Security before trust.</text><text x="500" y="105" fill="#91a8cc" text-anchor="middle" font-size="15">Evidence first. Clear limits. Better decisions.</text><path d="M300 138H700" stroke="url(#accent)"/></svg>