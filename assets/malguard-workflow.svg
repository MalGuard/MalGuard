<text x="23" y="219" font-family="Arial, sans-serif" font-size="12" letter-spacing=".6" fill="#b6c8dc">ILLUSTRATIVE ONLY  ·  BACKEND AVAILABILITY MUST BE VERIFIED  ·  UNKNOWN IS NOT SAFE</text>
