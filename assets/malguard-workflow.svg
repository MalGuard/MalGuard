<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="t d"><title id="t">MalGuard Defensive Analysis Pipeline</title><desc id="d">Illustrative animated steps for inspecting, verifying, isolating when certified and reporting on untrusted files.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061323"/><stop offset="1" stop-color="#11102b"/></linearGradient><linearGradient id="line"><stop stop-color="#48e5ff"/><stop offset=".5" stop-color="#ae83ff"/><stop offset="1" stop-color="#1de0bc"/></linearGradient><clipPath id="c"><rect width="1120" height="240" rx="18"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1120" height="240" fill="url(#bg)"/><path d="M 22 48 H 1098" stroke="url(#line)" stroke-opacity=".27"/>
<text x="23" y="34" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#b8e6ff">DEFENSIVE ANALYSIS / REFERENCE WORKFLOW</text>
<g>
