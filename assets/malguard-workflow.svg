<text x="588" y="104" text-anchor="middle" fill="#27edc5" font-size="15" font-weight="800" font-family="Arial, sans-serif">03</text>
<text x="570" y="139" font-size="24" font-weight="800" font-family="Arial, sans-serif" letter-spacing="1.5" fill="#eef8ff">ISOLATE</text>
