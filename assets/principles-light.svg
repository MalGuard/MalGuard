<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="201" viewBox="0 0 1000 201" role="img" aria-labelledby="title"><title id="title">Inspect files, verify evidence, isolate only with verified support, report findings and limitations.</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f6f9ff"/></linearGradient><linearGradient id="accent"><stop stop-color="#00bdf4"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#9a6bff"/></linearGradient><radialGradient id="aura"><stop stop-color="#2F6BFF" stop-opacity=".08"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:monospace;letter-spacing:2px}.orbit{transform-origin:center;animation:turn 14s linear infinite}.float{animation:float 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.scan{animation:scan 6s linear infinite}@keyframes scan{to{stroke-dashoffset:-928}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes pulse{50%{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="998" height="199" rx="20" fill="url(#bg)" stroke="#dbe3ee"/><text x="36" y="37" class="mono" font-size="11" fill="#1758b5">THE ENGINEERING PRINCIPLE</text><text x="36" y="86" fill="#526782" font-size="15" class="mono">01</text><text x="36" y="118" fill="#12233d" font-size="22" font-weight="700">INSPECT</text><text x="36" y="147" fill="#526782" font-size="13">Files, archives and scripts</text><path d="M195 108H244M237 101L244 108L237 115" stroke="#92afd1" stroke-width="1.5" fill="none"/><text x="279" y="86" fill="#526782" font-size="15" class="mono">02</text><text x="279" y="118" fill="#12233d" font-size="22" font-weight="700">VERIFY</text><text x="279" y="147" fill="#526782" font-size="13">Evidence and capability</text><path d="M438 108H487M480 101L487 108L480 115" stroke="#92afd1" stroke-width="1.5" fill="none"/><text x="522" y="86" fill="#526782" font-size="15" class="mono">03</text><text x="522" y="118" fill="#12233d" font-size="22" font-weight="700">ISOLATE</text><text x="522" y="147" fill="#526782" font-size="13">Only with verified support</text><path d="M681 108H730M723 101L730 108L723 115" stroke="#92afd1" stroke-width="1.5" fill="none"/><text x="765" y="86" fill="#526782" font-size="15" class="mono">04</text><text x="765" y="118" fill="#12233d" font-size="22" font-weight="700">REPORT</text><text x="765" y="147" fill="#526782" font-size="13">Findings and limitations</text><path d="M36 176H964" stroke="#dbe3ee"/><path class="scan" d="M36 176H964" stroke="url(#accent)" stroke-width="2" stroke-dasharray="90 838"/></svg>